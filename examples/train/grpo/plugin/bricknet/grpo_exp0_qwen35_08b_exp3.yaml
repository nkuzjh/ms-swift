ENV:
  CUDA_VISIBLE_DEVICES: "0"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  ROOT_IMAGE_DIR: "/home/jiahao/task/BrickNet"
  BRICKNET_ROOT: "/home/jiahao/task/BrickNet"
  BRICKNET_DATA: "/home/jiahao/.local/share/bricknet"
  BRICKNET_COLLISION_CHECK: "true"
  BRICKNET_POSE_TRANSLATION_TOLERANCE: "0.5"
  BRICKNET_POSE_ROTATION_TOLERANCE: "5.0"
  BRICKNET_POSE_SUCCESS_THRESHOLD: "1.0"
  MAX_PIXELS: "589824"
  MIN_PIXELS: "1024"

rlhf_type: grpo
model: models/Qwen3.5-0.8B-PT-exp0-merged
model_type: qwen3_5
adapters:
  - models/Qwen3.5-0.8B-exp3-adapter
ref_adapters:
  - models/Qwen3.5-0.8B-exp3-adapter
external_plugins:
  - examples/train/grpo/plugin/bricknet/bricknet_reward_plugin.py
reward_funcs:
  - bricknet_parse_prefix
  - bricknet_inventory_f1
  - bricknet_length
  - bricknet_collision_prefix
  - bricknet_pose_match
reward_weights:
  - "0.20"
  - "0.20"
  - "0.10"
  - "0.20"
  - "0.30"

dataset:
  - data/BrickNet-MM-RL_n2000_seed42.jsonl
dataset_shuffle: true
split_dataset_ratio: 0
max_length: 4096
truncation_strategy: delete
max_pixels: 589824
enable_thinking: false
response_prefix: ""
add_non_thinking_prefix: false

tuner_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
target_modules:
  - all-linear
freeze_vit: true
freeze_aligner: true
torch_dtype: bfloat16

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.45
vllm_tensor_parallel_size: 1
vllm_max_model_len: 9216
vllm_max_lora_rank: 64
vllm_enable_lora: true
vllm_enable_prefix_caching: true
sleep_level: 1

num_generations: 8
temperature: 0.9
top_p: 1.0
top_k: -1
repetition_penalty: 1.0
max_completion_length: 4096
beta: 0.04
num_iterations: 1
epsilon: 0.2
scale_rewards: group
overlong_filter: true

num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 0.000005
lr_scheduler_type: cosine
warmup_steps: 0
max_grad_norm: 1.0
gradient_checkpointing: true

logging_steps: 1
save_steps: 50
save_total_limit: 3
log_completions: true
report_to:
  - tensorboard
output_dir: output/bricknet_grpo/exp0_qwen35_08b_exp3_rl_n2000_g8
add_version: false
seed: 42
data_seed: 42
dataloader_num_workers: 4
dataset_num_proc: 4
